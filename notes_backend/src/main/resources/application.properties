spring.application.name=notesbackend

# H2 Database Configuration (File-based for persistence across restarts)
spring.datasource.url=jdbc:h2:file:./data/notesdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.swagger-ui.syntaxHighlight.theme=agate
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.swagger-ui.customcss=/swagger-custom.css

# Ocean Professional Theme Metadata (for visibility and consistency)
ocean.theme.primary=#2563EB
ocean.theme.secondary=#F59E0B
ocean.theme.accent=#F59E0B
ocean.theme.error=#EF4444
ocean.theme.background=#f9fafb
ocean.theme.surface=#ffffff
ocean.theme.text=#111827
